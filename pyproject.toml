[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gamarca"
version = "0.6.0"
description = "Graph-aware, Multimodal, Abductive Root Cause Analysis for Microservices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Achmad Solaeman", email = "achmad.solaeman@ugm.ac.id" },
    { name = "Nur Rohman Rosyid" },
    { name = "Ardhi Wicaksono" },
    { name = "Prima Asmara Sejati" },
    { name = "Hamzah" },
]
keywords = [
    "root-cause-analysis",
    "AIOps",
    "microservices",
    "Bayesian-inference",
    "abductive-reasoning",
    "large-language-models",
    "observability"
]
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "networkx>=3.0",
    "drain3>=0.9.11",
    "jieba>=0.42.1",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyflakes>=3.0.0",
]
wandb = [
    "wandb>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gama*", "baselines*", "adapters*", "agents*", "pipeline*", "data*", "evaluation*", "config*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
